# Merge this section into your existing CPA config. Do not replace client keys.
# The plugin filename ID and this config key must both be "our-free-model".
plugins:
  enabled: true
  dir: plugins
  configs:
    our-free-model:
      enabled: true
      priority: 0
      model-prefix: "ofm/"
      auto-install-node: true
      auto-install-eac: false
      port: 0
      console-port: 0 # Optional local fallback only; normal console uses the CPA domain.
      refresh-models: true
      catalog-revision: 1
      # Optional absolute private data directory (not your plugin source path).
      # data-dir: "G:/ofm-cpa-data"
      # node-path: "C:/Program Files/nodejs/node.exe"
      # eac-source-dir: "G:/coding/dsh-our-free-model"
